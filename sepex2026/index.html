<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     div{
        border: 1px solid rgb(8, 4, 4);
        width: 500px;
        height: 400px;
        box-shadow: 50px -120px 25px #333;

     }
     h2{
       text-shadow: 2px 5px 4px;
     }
     img:hover {
     filter: blur(5px);
     }
     div:hover{
        transform: translateX(130px);
        transform: transform 100px;
     }
     .button{
        text-decoration: none;
        color: #000;
        background-color: red;
        padding:10px 30px;
        border-radius: 30px;
        box-shadow: 3px 2px 5px #00f;
     }
     .button:hover{

        transform: scale(.9);
        background-color: #00f;
        transition: all 100ms ease-in;

     }
     img


    </style>
</head>

<body>
    <h1>VASCO DA GAMA</h1>

    <div>
        <h2>Andrés gomez</h2>
        <img src="andres-gomez.jpg">
    </div>
</body>

</html>
